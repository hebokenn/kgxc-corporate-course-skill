<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程工作台</title><link rel="stylesheet" href="/studio.css"></head>
<body><header><div><p id="stage-kicker">课程工作台</p><h1 id="course-title">正在恢复课程</h1></div><span id="save-status" role="status"></span><details id="studio-tools" class="studio-tools"><summary>课程设置与记录</summary><div id="studio-tools-content"><p class="tools-caption">按需调整，不影响 AI 自动执行</p><button id="production-preferences" disabled>调整制作偏好</button><button id="undo" disabled>撤销上次编辑</button></div></details><button id="primary" class="primary" disabled>正在读取</button></header>
<section id="production-progress" aria-label="制作进度"><div class="progress-heading"><strong id="production-label" role="status">正在读取制作进度</strong><span id="production-owner">制作状态</span></div><div class="production-track"><progress id="production-bar" max="1" value="0" aria-label="当前制作进度"></progress><span class="production-indeterminate" aria-hidden="true"></span></div><p id="production-detail"></p><details id="production-steps" hidden><summary>查看具体制作步骤与耗时</summary><p id="production-issue" role="alert" hidden></p><ol id="production-step-list"></ol></details></section>
<div id="notice" role="status" hidden></div><section id="proposals" hidden></section><main id="content" aria-label="当前制课阶段"></main>
<dialog id="rewrite"><form method="dialog"><div class="row"><h2>修改选中的文字</h2><button value="cancel" aria-label="关闭修改建议">关闭</button></div></form><blockquote id="rewrite-selection"></blockquote><label>希望怎么改<input id="rewrite-instruction" placeholder="例如：更口语化，保留事实和步骤"></label><button id="rewrite-generate">生成建议</button><p id="rewrite-status" role="status"></p><label id="rewrite-result" hidden>AI 建议<textarea id="rewrite-suggestion"></textarea></label><button id="rewrite-accept" class="primary" disabled>采用这段修改</button></dialog>
<script type="module" src="/studio.js"></script></body></html>
