<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程资源预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e6e6e6;color:#383838;font:16px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}header{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}h1{font-size:24px;margin:0;flex:1}select,button{font:inherit;border:1px solid #a8a8a8;background:#ffffff;color:#3e3e3e;border-radius:7px;padding:10px 14px}iframe{border:0;width:100%;aspect-ratio:16/9;background:#ffffff;display:block}nav{display:flex;align-items:center;gap:18px;padding:18px 0}input{flex:1;accent-color:#707070}small{color:#717171}#error{color:#4f4f4f}@media(max-width:700px){main{padding:14px}header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}h1{grid-column:1/-1;font-size:20px}select{min-width:0;width:100%;padding:9px}nav{gap:8px}nav button{padding:8px}}</style>
<main><header><h1>课程资源实际预览</h1><select id="scene" aria-label="选择示例"></select><button id="play">播放</button></header><iframe id="screen" src="/renderer.html" title="实际课程画布"></iframe><nav><button id="back">上一项</button><input id="time" type="range" min="0" max="149" value="0" aria-label="定位帧"><button id="next">下一项</button></nav><p id="purpose"></p><small>静音资源演示。可拖动查看动作前、中、后状态；正式课程按实际旁白编排。</small><p id="error"></p></main>
<script>
(async()=>{const $=s=>document.querySelector(s),frame=$('#screen'),select=$('#scene'),slider=$('#time');let d,playing=false,stamp=0,local=0,busy=false;
try{d=await fetch('/api/document').then(r=>r.json());for(const [i,s]of d.scenes.entries()){const o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' '+s.title;select.append(o)}
for(let i=0;i<1200&&!frame.contentWindow.ready;i++){if(frame.contentWindow.renderError)throw Error(frame.contentWindow.renderError);await new Promise(r=>setTimeout(r,30))}if(!frame.contentWindow.ready)throw Error('预览尚未就绪');
const initial=Number(new URLSearchParams(location.search).get('scene')||0);if(Number.isInteger(initial)&&initial>=0&&initial<d.scenes.length)select.value=initial;
function scene(){return d.scenes[Number(select.value)]}async function draw(){if(busy)return;busy=true;try{const s=scene();await frame.contentWindow.courseRenderer.drawFrame(s.sourceStartFrame+Math.round(local));slider.value=local}catch(e){$('#error').textContent=e.message;playing=false}finally{busy=false}}
function change(){const s=scene();slider.max=s.sourceEndFrame-s.sourceStartFrame-1;local=0;$('#purpose').textContent=(d.motionPlan?.beats||[]).find(b=>b.sceneId===s.id&&b.purpose)?.purpose||s.title;draw()}
select.onchange=change;slider.oninput=()=>{playing=false;$('#play').textContent='播放';local=Number(slider.value);draw()};$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'暂停':'播放';stamp=0};$('#next').onclick=()=>{select.value=(Number(select.value)+1)%d.scenes.length;change()};$('#back').onclick=()=>{select.value=(Number(select.value)+d.scenes.length-1)%d.scenes.length;change()};
function tick(t){if(playing){if(stamp)local=(local+(t-stamp)*d.fps/1000)%Number(slider.max);draw()}stamp=t;requestAnimationFrame(tick)}change();requestAnimationFrame(tick)
}catch(e){$('#error').textContent=e.message}})();
</script></html>
