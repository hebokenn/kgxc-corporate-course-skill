<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>酷果星创课程共创与制作</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:1280px;height:640px;margin:0;overflow:hidden; }
    body { background:#f5f5f2;color:#181b1a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
    .brand { position:absolute;top:32px;left:62px;width:320px;height:92px;overflow:hidden; }
    .brand img { position:absolute;width:780px;max-width:none;left:-266px;top:-153px; }
    .copy { position:absolute;left:64px;top:185px;z-index:3; }
    h1 { margin:0;font-size:62px;line-height:1.34;font-weight:760;letter-spacing:-2px; }
    h1 span { color:#df111a; }
    p { margin:29px 0 0;font-size:23px;line-height:1.7;color:#565c58; }
    .screen { position:absolute;border:1px solid #dfe2dc;border-radius:12px;overflow:hidden;background:white;box-shadow:0 18px 60px #1b27151a; }
    .screen img { width:100%;display:block; }
    .film { left:640px;top:58px;width:646px;transform:rotate(-3deg); }
    .editor { left:615px;top:375px;width:810px;transform:rotate(-3deg); }
    .edge { position:absolute;left:0;top:0;width:8px;height:640px;background:#df111a; }
  </style>
</head>
<body>
  <div class="edge" aria-hidden="true"></div>
  <div class="brand"><img src="../../../skills/corporate-training-motion/assets/profiles/kgxc/kgxc-logo.png" alt="酷果星创"></div>
  <div class="copy">
    <h1>把原始资料，<br>做成一门<span>好课。</span></h1>
    <p>课程设计、逐字稿、课件与视频，<br>在同一套工作流里完成。</p>
  </div>
  <div class="screen film"><img src="../intro-poster.png" alt="实际导出的品牌片头"></div>
  <div class="screen editor"><img src="../v5-editor.png" alt="实际v5课程工作台"></div>
</body>
</html>
