name: Publish KGXC 42-second story trailer
on:
  push:
    branches: [showcase/story-42-v698]
permissions:
  contents: read
jobs:
  verify-and-append:
    if: github.repository == 'hebokenn/kgxc-corporate-course-skill' && github.ref == 'refs/heads/showcase/story-42-v698'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify only the approved trailer and poster
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 6.9.8
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          cd docs/media/story-42-publish
          diff -u STORY-TRAILER-SHA256SUMS - <<'SUMS'
          d0a2824009538e5a6f0a1ef9f8a9f5329928a7bee6fa6fdc960c8c522f397498  kgxc-story-trailer-42.mp4
          f2cddbca8cef5efe7996473619162f849ea03a288ec7f926f8691b35272b49e0  kgxc-story-trailer-42-poster.jpg
          SUMS
          sha256sum -c STORY-TRAILER-SHA256SUMS
          ffmpeg -v error -xerror -i kgxc-story-trailer-42.mp4 -f null -
          ffmpeg -v error -xerror -i kgxc-story-trailer-42-poster.jpg -f null -
          ffprobe -v error -count_frames -show_entries stream=codec_name,width,height,channels,nb_read_frames -show_entries format=duration -of json kgxc-story-trailer-42.mp4 | python3 -c 'import json,sys;d=json.load(sys.stdin);v=next(s for s in d["streams"] if s["codec_name"]=="h264");assert (v["width"],v["height"],v["nb_read_frames"])==(1920,1080,"1260");assert abs(float(d["format"]["duration"])-42)<0.04;assert any(s["codec_name"]=="aac" and s["channels"]==2 for s in d["streams"])'
      - name: Append verified video and preserve all existing downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v6.9.8" --jq .object.sha)" = 7bfd2f9b3e3e0fec33b454c7f95de6b41135fa18
          api="repos/$GITHUB_REPOSITORY/releases"
          dir=docs/media/story-42-publish
          gh api "$api/latest" > /tmp/kgxc-42-before.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('docs/media/story-42-publish')
          r=json.loads(Path('/tmp/kgxc-42-before.json').read_text())
          assert (r['id'],r['tag_name'],r['draft'],r['prerelease'])==(445696617,'v6.9.8',False,False)
          baseline=json.loads((d/'prior-assets.json').read_text())
          assets={a['name']:[a['id'],a['size'],a['digest']] for a in r['assets']}
          assert assets==baseline, 'Release assets changed; stop rather than clobber'
          assert '## 当前主宣传片：42 秒卡点版' not in r['body']
          Path('/tmp/kgxc-42-notes.md').write_text((d/'release-addendum.md').read_text().strip()+'\n\n'+r['body'])
          PY
          gh release upload v6.9.8 "$dir/kgxc-story-trailer-42.mp4" "$dir/kgxc-story-trailer-42-poster.jpg" "$dir/STORY-TRAILER-SHA256SUMS"
          gh api "$api/latest" > /tmp/kgxc-42-after.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('docs/media/story-42-publish')
          before=json.loads(Path('/tmp/kgxc-42-before.json').read_text())
          after=json.loads(Path('/tmp/kgxc-42-after.json').read_text())
          assert (after['id'],after['tag_name'])==(before['id'],before['tag_name'])
          assets={a['name']:a for a in after['assets']}
          for a in before['assets']:
              assert all(a[k]==assets[a['name']][k] for k in ('id','size','digest')),a['name']
          n={'kgxc-story-trailer-42.mp4','kgxc-story-trailer-42-poster.jpg','STORY-TRAILER-SHA256SUMS'}
          assert set(assets)=={a['name'] for a in before['assets']} | n
          for name in n:
              data=(d/name).read_bytes()
              assert assets[name]['state']=='uploaded' and assets[name]['size']==len(data)
              assert assets[name]['digest']=='sha256:'+hashlib.sha256(data).hexdigest()
          PY
          gh release edit v6.9.8 --notes-file /tmp/kgxc-42-notes.md
