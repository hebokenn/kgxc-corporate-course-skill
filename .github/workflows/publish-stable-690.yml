name: Publish KGXC 6.9.0 updater trial
on:
  push:
    branches: [release/6.9.0-updater-trial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'hebokenn/kgxc-corporate-course-skill' && github.ref == 'refs/heads/release/6.9.0-updater-trial'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build frozen source and validate every payload entry
        run: |
          python3 -B scripts/build_release.py
          python3 -B scripts/build_plugin.py
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          expected = {
            'kgxc-course-plugin-v0.9.0.zip': (1609, '8f6e098b2a2c97ad2d7db1e84ca34f6f5a8b06c1b7dfa17d154352faa8b3bb65'),
            'kgxc-course-suite-v6.9.0.zip': (1495, '3b2fd7cc6c08bf474da7e4eaac25550e171469067b27f2c5ce066789a8bd74ce'),
          }
          for name, (count, digest) in expected.items():
            with zipfile.ZipFile(Path('dist') / name) as z:
              names = z.namelist()
              assert z.testzip() is None and len(names) == len(set(names)) == count
              entries = {}
              for member in sorted(names):
                data = z.read(member)
                if member.endswith('bundle-manifest.json'):
                  data = json.dumps(json.loads(data), sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
                entries[member] = hashlib.sha256(data).hexdigest()
              actual = hashlib.sha256(json.dumps(entries, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              assert actual == digest, (name, actual)
          PY
          (cd dist && sha256sum -c SHA256SUMS && sha256sum -c PLUGIN-SHA256SUMS)
      - name: Upload to a draft and publish only after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v6.9.0 --target "$GITHUB_SHA" --draft --title 'KGXC 6.9.0 / DSH 0.9.0' --notes 'DSH stable-channel update reminder trial. No automatic installation. Desktop end-to-end course production is not part of this verification.'
          gh release upload v6.9.0 dist/kgxc-course-suite-v6.9.0.zip dist/kgxc-course-plugin-v0.9.0.zip dist/SHA256SUMS dist/PLUGIN-SHA256SUMS
          gh release view v6.9.0 --json assets --jq '.assets | map(select(.size > 0)) | length' | grep -Fx 4
          gh release edit v6.9.0 --draft=false --latest
